services:
  mongo:
    image: mongo:latest
    container_name: stockflow-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - stockflow-network

  postgres:
    image: postgres:17-alpine
    container_name: stockflow-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=stockflow_inventory
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stockflow-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: stockflow-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - stockflow-network

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: stockflow-user-service
    ports:
      - "3001:3000"
      - "50052:50052"
    environment:
      - PORT=3000
      - GRPC_PORT=50052
      - MONGO_URI=mongodb://mongo:27017/stockflow
      - JWT_SECRET=stockflow_user_service_jwt_secret_key_2026
    depends_on:
      - mongo
    networks:
      - stockflow-network

  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: stockflow-inventory-service
    ports:
      - "3002:3000"
      - "50051:50051"
    environment:
      - PORT=3000
      - GRPC_PORT=50051
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/stockflow_inventory?schema=public
    depends_on:
      - postgres
    networks:
      - stockflow-network

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: stockflow-order-service
    ports:
      - "3003:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/stockflow_orders
      - INVENTORY_GRPC_HOST=inventory-service:50051
      - USER_GRPC_HOST=user-service:50052
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      - mongo
      - inventory-service
      - user-service
      - rabbitmq
    networks:
      - stockflow-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: stockflow-notification-service
    ports:
      - "3004:3000"
    environment:
      - PORT=3000
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      - rabbitmq
    networks:
      - stockflow-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: stockflow-api-gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=stockflow_user_service_jwt_secret_key_2026
    depends_on:
      - user-service
      - inventory-service
      - order-service
    networks:
      - stockflow-network

volumes:
  mongo_data:
  postgres_data:

networks:
  stockflow-network:
    driver: bridge
